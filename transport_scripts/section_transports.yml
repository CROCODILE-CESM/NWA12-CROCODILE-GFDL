# Section transport definitions
#
# Each section is defined by two endpoints (lon1, lon2, lat1, lat2).
# The script determines the transport component automatically:
#   - lon1 == lon2  ->  umo  (fixed longitude, meridional section)
#   - lat1 == lat2  ->  vmo  (fixed latitude,  zonal section)
#
# Coordinates are in degrees (negative = West / South).

sections:
  Drake_Passage:
    lon1: -67.0
    lon2: -67.0
    lat1: -67.2
    lat2: -55.1

  # ---- examples of additional sections (uncomment to activate) ----

